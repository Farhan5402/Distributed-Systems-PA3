syntax = "proto3";

package twopc;

// Vote phase messages
message VoteRequest {
    string transaction_id = 1;
    string operation = 2;  // e.g., "add_track", "remove_track", "vote"
    string payload = 3;    // JSON-encoded operation data
    string coordinator_id = 4;
}

message VoteResponse {
    string transaction_id = 1;
    string participant_id = 2;
    bool vote_commit = 3;  // true = VoteCommit, false = VoteAbort
    string reason = 4;     // Optional reason for abort
}

// Decision phase messages
message GlobalDecision {
    string transaction_id = 1;
    bool commit = 2;  // true = GlobalCommit, false = GlobalAbort
    string coordinator_id = 3;
}

message DecisionAck {
    string transaction_id = 1;
    string participant_id = 2;
    bool success = 3;
}

// Intra-node communication messages (Voting Phase -> Decision Phase)
message VotingResult {
    string transaction_id = 1;
    string operation = 2;
    string payload = 3;
    bool all_voted_commit = 4;
    string coordinator_id = 5;
}

message DecisionCommand {
    string transaction_id = 1;
    bool commit = 2;
    string message = 3;
}

// Voting Phase Service (runs on port 50051)
service VotingPhaseService {
    // Inter-node: Coordinator -> Participant voting request
    rpc RequestVote (VoteRequest) returns (VoteResponse);
}

// Decision Phase Service (runs on port 50052)
service DecisionPhaseService {
    // Inter-node: Coordinator -> Participant decision
    rpc SendDecision (GlobalDecision) returns (DecisionAck);
    
    // Intra-node: Voting Phase -> Decision Phase (within same container)
    rpc ExecuteDecision (VotingResult) returns (DecisionCommand);
}
