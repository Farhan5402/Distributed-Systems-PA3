services:
  node:
    build: ./node
    deploy:
      replicas: 5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s  # Reduced frequency: every 30 seconds instead of 10
      timeout: 3s
      retries: 3
      start_period: 10s
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node
  # Each node gets its own Redis replica
  redis-1:
    image: redis:7-alpine
    restart: unless-stopped
  redis-2:
    image: redis:7-alpine
    restart: unless-stopped
  redis-3:
    image: redis:7-alpine
    restart: unless-stopped
  redis-4:
    image: redis:7-alpine
    restart: unless-stopped
  redis-5:
    image: redis:7-alpine
    restart: unless-stopped
  test-runner:
    build:
      context: ./node
    environment:
      - API_URL=http://nginx:8080
    depends_on:
      - node
      - nginx
    volumes:
      - ./tests:/app/tests
    working_dir: /app/tests
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    restart: unless-stopped