services:
  node-1:
    build: ./node
    container_name: layered-rest-node-1
    environment:
      - NODE_ID=1
      - REDIS_HOST=redis-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  
  node-2:
    build: ./node
    container_name: layered-rest-node-2
    environment:
      - NODE_ID=2
      - REDIS_HOST=redis-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  
  node-3:
    build: ./node
    container_name: layered-rest-node-3
    environment:
      - NODE_ID=3
      - REDIS_HOST=redis-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  
  node-4:
    build: ./node
    container_name: layered-rest-node-4
    environment:
      - NODE_ID=4
      - REDIS_HOST=redis-4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  
  node-5:
    build: ./node
    container_name: layered-rest-node-5
    environment:
      - NODE_ID=5
      - REDIS_HOST=redis-5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  
  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5
  # Each node gets its own Redis replica
  redis-1:
    image: redis:7-alpine
    restart: unless-stopped
  redis-2:
    image: redis:7-alpine
    restart: unless-stopped
  redis-3:
    image: redis:7-alpine
    restart: unless-stopped
  redis-4:
    image: redis:7-alpine
    restart: unless-stopped
  redis-5:
    image: redis:7-alpine
    restart: unless-stopped
  test-runner:
    build:
      context: ./node
    environment:
      - API_URL=http://nginx:8080
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5
      - nginx
    volumes:
      - ./tests:/app/tests
    working_dir: /app/tests
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    restart: unless-stopped