version: '3.8'

services:
  # Node 1
  node-1:
    build: ./node
    container_name: raft-node-1
    environment:
      - NODE_ID=node-1
      - REDIS_HOST=redis-1
      - REDIS_PORT=6379
      - GRPC_PORT=50051
      - RAFT_PEERS=node-2:50051,node-3:50051,node-4:50051,node-5:50051
    ports:
      - "8001:8000"
      - "50051:50051"
    depends_on:
      - redis-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis-1:
    image: redis:7-alpine
    container_name: raft-redis-1

  # Node 2
  node-2:
    build: ./node
    container_name: raft-node-2
    environment:
      - NODE_ID=node-2
      - REDIS_HOST=redis-2
      - REDIS_PORT=6379
      - GRPC_PORT=50051
      - RAFT_PEERS=node-1:50051,node-3:50051,node-4:50051,node-5:50051
    ports:
      - "8002:8000"
      - "50052:50051"
    depends_on:
      - redis-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis-2:
    image: redis:7-alpine
    container_name: raft-redis-2

  # Node 3
  node-3:
    build: ./node
    container_name: raft-node-3
    environment:
      - NODE_ID=node-3
      - REDIS_HOST=redis-3
      - REDIS_PORT=6379
      - GRPC_PORT=50051
      - RAFT_PEERS=node-1:50051,node-2:50051,node-4:50051,node-5:50051
    ports:
      - "8003:8000"
      - "50053:50051"
    depends_on:
      - redis-3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis-3:
    image: redis:7-alpine
    container_name: raft-redis-3

  # Node 4
  node-4:
    build: ./node
    container_name: raft-node-4
    environment:
      - NODE_ID=node-4
      - REDIS_HOST=redis-4
      - REDIS_PORT=6379
      - GRPC_PORT=50051
      - RAFT_PEERS=node-1:50051,node-2:50051,node-3:50051,node-5:50051
    ports:
      - "8004:8000"
      - "50054:50051"
    depends_on:
      - redis-4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis-4:
    image: redis:7-alpine
    container_name: raft-redis-4

  # Node 5
  node-5:
    build: ./node
    container_name: raft-node-5
    environment:
      - NODE_ID=node-5
      - REDIS_HOST=redis-5
      - REDIS_PORT=6379
      - GRPC_PORT=50051
      - RAFT_PEERS=node-1:50051,node-2:50051,node-3:50051,node-4:50051
    ports:
      - "8005:8000"
      - "50055:50051"
    depends_on:
      - redis-5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/queue"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis-5:
    image: redis:7-alpine
    container_name: raft-redis-5

  # Nginx load balancer (optional, for distributing client requests)
  nginx:
    image: nginx:alpine
    container_name: raft-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5

  # Test runner
  test-runner:
    build:
      context: ./node
    container_name: raft-test-runner
    environment:
      - API_URL=http://node-1:8000
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4
      - node-5
    volumes:
      - ./tests:/app/tests
    entrypoint: ["tail", "-f", "/dev/null"]  # Keep running for manual test execution
